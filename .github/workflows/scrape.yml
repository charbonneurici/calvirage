name: Scraper Top 14 + Coupes d'Europe + XV de France

on:
  schedule:
    - cron: '0 6 * * 1'  # Lundi à 6h (après le week-end de matchs)
    - cron: '0 6 * * 4'  # Jeudi à 6h (matchs en semaine / reports)
  workflow_dispatch:       # Déclenchement manuel depuis GitHub

# Rappel : GitHub désactive un cron après 60 jours sans commit sur le repo.
# Le workflow se recommite lui-même à chaque mise à jour de fixtures, ce qui
# suffit à garder le compteur à zéro tant que des matchs bougent.

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      # Chaque scraper ne remplace que ses propres compétitions et sort en
      # erreur sans écrire s'il n'extrait rien : un échec isolé ne doit donc
      # pas empêcher les autres de tourner. Le résultat de chacun est relevé
      # plus bas pour que le job échoue quand même et qu'on soit alerté.
      - name: Scraper Top 14 (LNR)
        id: lnr
        continue-on-error: true
        run: node scripts/scrape-lnr.js

      - name: Scraper Champions Cup & Challenge Cup (EPCR)
        id: epcr
        continue-on-error: true
        run: node scripts/scrape-epcr.js

      - name: Scraper XV de France
        id: france
        continue-on-error: true
        run: node scripts/scrape-france.js

      - name: Commit et push si changement
        run: |
          git config user.name "CalVirage Bot"
          git config user.email "bot@calvirage.fr"
          git add data/fixtures.json
          if git diff --staged --quiet; then
            echo "Aucun changement de fixtures."
          else
            git commit -m "chore: mise à jour fixtures $(date +%Y-%m-%d)"
            git push
            echo "Fixtures mises à jour et poussées."
          fi

      - name: Vérifier que les trois scrapers ont réussi
        run: |
          echo "LNR:    ${{ steps.lnr.outcome }}"
          echo "EPCR:   ${{ steps.epcr.outcome }}"
          echo "France: ${{ steps.france.outcome }}"
          if [ "${{ steps.lnr.outcome }}" != "success" ] \
          || [ "${{ steps.epcr.outcome }}" != "success" ] \
          || [ "${{ steps.france.outcome }}" != "success" ]; then
            echo "::error::Au moins un scraper a échoué — les données de sa compétition sont figées."
            exit 1
          fi
